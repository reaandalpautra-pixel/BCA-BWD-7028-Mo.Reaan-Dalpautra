<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=d<!DOCTYPE html>
    <html lang="en">
    <head>
      <meta charset="UTF-8">
      <meta name="viewport" content="width=device-width, initial-scale=1.0">
      <title>Bootstrap Grid Table</title>
      <!-- Bootstrap 5 CSS CDN -->
      <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    </head>
    <body>
    
    <div class="container my-5">
      <h3 class="mb-4 text-center">Employee Directory</h3>
    
      <!-- Table Container using Grid -->
      <div class="border rounded overflow-hidden shadow-sm">
        
        <!-- Table Header Row -->
        <div class="row bg-dark text-white fw-bold py-2 px-1 text-center">
          <div class="col-1">ID</div>
          <div class="col-3">First Name</div>
          <div class="col-3">Last Name</div>
          <div class="col-3">Role</div>
          <div class="col-2">Status</div>
        </div>
    
        <!-- Data Row 1 -->
        <div class="row py-2 px-1 text-center align-items-center border-bottom">
          <div class="col-1 fw-bold">1</div>
          <div class="col-3">John</div>
          <div class="col-3">Doe</div>
          <div class="col-3">Developer</div>
          <div class="col-2"><span class="badge bg-success">Active</span></div>
        </div>
    
        <!-- Data Row 2 (Light Background for Striped Effect) -->
        <div class="row py-2 px-1 text-center align-items-center border-bottom bg-light">
          <div class="col-1 fw-bold">2</div>
          <div class="col-3">Jane</div>
          <div class="col-3">Smith</div>
          <div class="col-3">Designer</div>
          <div class="col-2"><span class="badge bg-success">Active</span></div>
        </div>
    
        <!-- Data Row 3 -->
        <div class="row py-2 px-1 text-center align-items-center">
          <div class="col-1 fw-bold">3</div>
          <div class="col-3">Robert</div>
          <div class="col-3">Johnson</div>
          <div class="col-3">Manager</div>
          <div class="col-2"><span class="badge bg-warning text-dark">On Leave</span></div>
        </div>
    
      </div>
    </div>
    
    <!-- Bootstrap 5 JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    </body>
    </html>">
