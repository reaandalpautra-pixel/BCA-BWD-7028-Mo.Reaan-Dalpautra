<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Blood Donation Form</title>
</head>
<body>
    <h2>Blood Donation Registration Form</h2>
    <form action="/submit-donation" method="POST">
        <h3>Personal Information</h3>
        <label for="full-name">Full Name:</label><br>
        <input type="text" id="full-name" name="full-name" required><br><br>

        <label for="dob">Date of Birth:</label><br>
        <input type="date" id="dob" name="dob" required><br><br>

        <label for="gender">Gender:</label>
        <select id="gender" name="gender">
            <option value="male">Male</option>
            <option value="female">Female</option>
            <option value="other">Other</option>
        </select><br><br>

        <label for="email">Email:</label><br>
        <input type="email" id="email" name="email"><br><br>

        <label for="phone">Phone Number:</label><br>
        <input type="tel" id="phone" name="phone" required><br><br>

        <h3>Medical Information</h3>
        <label for="blood-type">Blood Type:</label>
        <select id="blood-type" name="blood-type">
            <option value="A+">A+</option>
            <option value="A-">A-</option>
            <option value="B+">B+</option>
            <option value="B-">B-</option>
            <option value="AB+">AB+</option>
            <option value="AB-">AB-</option>
            <option value="O+">O+</option>
            <option value="O-">O-</option>
        </select><br><br>

        <label>Have you donated blood before?</label><br>
        <input type="radio" id="yes" name="donated-before" value="yes">
        <label for="yes">Yes</label>
        <input type="radio" id="no" name="donated-before" value="no">
        <label for="no">No</label><br><br>

        <input type="submit" value="Submit Donation Form">
    </form>
</body>
</html>
