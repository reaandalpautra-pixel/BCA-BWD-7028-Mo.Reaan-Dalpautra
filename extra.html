<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Display Image with CSS</title>
    <style>
        /* General page styling */
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        /* Container card for the image */
        .image-card {
            background-color: #ffffff;
            padding: 15px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            text-align: center;
            max-width: 400px;
            width: 100%;
        }

        /* CSS styling for the image */
        .image-card img {
            width: 100%;
            height: auto;
            border-radius: 8px;
            transition: transform 0.3s ease, filter 0.3s ease;
        }

        /* Hover effect to make the image interactive */
        .image-card img:hover {
            transform: scale(1.03);
            filter: brightness(1.05);
        }

        /* Caption styling */
        .image-card p {
            margin-top: 12px;
            color: #333333;
            font-size: 16px;
            font-weight: 500;
        }
        
    </style>
</head>
<body>

    <div class="image-card">
        <!-- Replace 'your-image.jpg' with your actual image path or URL -->
        <img src="C:\7028 reaan\5img\bmw_SS.png" alt="A descriptive description of the image">
        <p>Beautiful scean</p>
    </div>

</body>
</html>
