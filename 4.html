<!--write a javascipt program to take input from user and check if number is armstrong or not-->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ARMSTORANG NUMBER</title>
</head>
<body>
    <script>
            
            let num = prompt("Enter a number: ");
            let sum = 0;
            let temp = num;
            let digits = num.length;
    
            while (temp > 0) {
                let remainder = temp % 10;
                sum += Math.pow(remainder, digits);
                temp = Math.floor(temp / 10);
            }
    
            if (sum == num) {
                alert(num + " is an Armstrong number.");
            } else {
                alert(num + " is not an Armstrong number.");
            }
    </script>
</body>
</html>
