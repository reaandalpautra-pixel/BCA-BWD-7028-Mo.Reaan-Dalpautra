<!DOCTYPE html>
<html lang="en">
<head>

    <title>Document</title>
</head>
<body>
    
    <script>
                function checkEvenOrOdd(number) {
            if (number % 2 === 0) {
                return `${number} is Even.`;
            } else {
                return `${number} is Odd.`;
            }
        }
        console.log(checkEvenOrOdd(4)); 
        console.log(checkEvenOrOdd(7));
    </script>
</body>
</html>
