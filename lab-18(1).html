<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    

    <script>
        // Get student details using prompt dialog boxes
        let studentName = prompt("Enter student's name:");
        let studentClass = prompt("Enter student's class:");
        let studentStream = prompt("Enter student's stream (e.g., Science, Commerce, Arts):");

        // Format and display the details in an alert box
        alert(
            "--- Student Details ---\n" +
            "Name: " + studentName + "\n" +
            "Class: " + studentClass + "\n" +
            "Stream: " + studentStream
        );
    </script>
</body>
</html>
