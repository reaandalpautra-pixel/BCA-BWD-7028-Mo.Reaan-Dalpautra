<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bootstrap Grid Table</title>
    <!-- Bootstrap 5 CSS CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .grid-table-header {
            background-color: #343a40;
            color: white;
            font-weight: bold;
            padding: 12px 10px;
        }
        .grid-table-row {
            padding: 10px;
            border-bottom: 1px solid #dee2e6;
        }
        .grid-table-row:nth-child(even) {
            background-color: #f8f9fa;
        }
        .grid-table-row:hover {
            background-color: #e9ecef;
        }
    </style>
</head>
<body class="bg-light py-5">

    <div class="container">
        <h2 class="mb-4 text-center">Custom Table Using Bootstrap Grid System</h2>
        
        <div class="card shadow-sm border-0">
            <div class="card-body p-0">
                <!-- Table Header Row -->
                <div class="row g-0 grid-table-header text-center text-md-start">
                    <div class="col-md-1 col-2">#ID</div>
                    <div class="col-md-3 col-4">Name</div>
                    <div class="col-md-4 d-none d-md-block">Email Address</div>
                    <div class="col-md-2 col-4">Role</div>
                    <div class="col-md-2 col-2 text-center">Status</div>
                </div>

                <!-- Table Body Rows -->
                <div class="row g-0 grid-table-row align-items-center text-center text-md-start">
                    <div class="col-md-1 col-2 fw-bold text-muted">1</div>
                    <div class="col-md-3 col-4 fw-semibold">Alice Johnson</div>
                    <div class="col-md-4 d-none d-md-block text-muted">alice@example.com</div>
                    <div class="col-md-2 col-4"><span class="badge bg-primary">Admin</span></div>
                    <div class="col-md-2 col-2 text-center"><span class="text-success fw-bold">●</span> Active</div>
                </div>

                <div class="row g-0 grid-table-row align-items-center text-center text-md-start">
                    <div class="col-md-1 col-2 fw-bold text-muted">2</div>
                    <div class="col-md-3 col-4 fw-semibold">Bob Smith</div>
                    <div class="col-md-4 d-none d-md-block text-muted">bob@example.com</div>
                    <div class="col-md-2 col-4"><span class="badge bg-secondary">Editor</span></div>
                    <div class="col-md-2 col-2 text-center"><span class="text-success fw-bold">●</span> Active</div>
                </div>

                <div class="row g-0 grid-table-row align-items-center text-center text-md-start">
                    <div class="col-md-1 col-2 fw-bold text-muted">3</div>
                    <div class="col-md-3 col-4 fw-semibold">Charlie Davis</div>
                    <div class="col-md-4 d-none d-md-block text-muted">charlie@example.com</div>
                    <div class="col-md-2 col-4"><span class="badge bg-info text-dark">Viewer</span></div>
                    <div class="col-md-2 col-2 text-center"><span class="text-danger fw-bold">●</span> Offline</div>
                </div>
            </div>
        </div>
    </div>

</body>
</html>
