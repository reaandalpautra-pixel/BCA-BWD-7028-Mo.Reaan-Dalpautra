<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blood Donation Registration</title>
    <style>
        body { font-family: sans-serif; line-height: 1.6; max-width: 600px; margin: 20px auto; padding: 20px; background-color: #f4f4f4; }
        form { background: #fff; padding: 20px; border-radius: 8px; box-shadow: 0 0 10px rgba(0,0,0,0.1); }
        h2 { color: #d9534f; }
        label { display: block; margin-top: 10px; font-weight: bold; }
        input[type="text"], input[type="email"], input[type="date"], input[type="tel"], select, textarea { width: 100%; padding: 8px; margin-top: 5px; border: 1px solid #ccc; border-radius: 4px; }
        .radio-group { margin-top: 10px; }
        button { background: #d9534f; color: white; padding: 10px 20px; border: none; border-radius: 4px; margin-top: 20px; cursor: pointer; width: 100%; font-size: 16px; }
        button:hover { background: #c9302c; }
    </style>
</head>
<body>

<form action="#" method="POST">
    <h2>Blood Donation Registration</h2>
    
    <!-- Donor Information -->
    <label for="name">Full Name</label>
    <input type="text" id="name" name="name" required>

    <label for="dob">Date of Birth</label>
    <input type="date" id="dob" name="dob" required>

    <label for="email">Email Address</label>
    <input type="email" id="email" name="email" required>

    <label for="blood-type">Blood Type</label>
    <select id="blood-type" name="blood-type">
        <option value="">Select your blood type</option>
        <option value="A+">A+</option>
        <option value="A-">A-</option>
        <option value="B+">B+</option>
        <option value="B-">B-</option>
        <option value="AB+">AB+</option>
        <option value="AB-">AB-</option>
        <option value="O+">O+</option>
        <option value="O-">O-</option>
    </select>

    <!-- Health Screening -->
    <label>Have you donated blood in the last 3 months?</label>
    <div class="radio-group">
        <input type="radio" id="donated-yes" name="recent-donation" value="yes"> <label style="display:inline" for="donated-yes">Yes</label>
        <input type="radio" id="donated-no" name="recent-donation" value="no"> <label style="display:inline" for="donated-no">No</label>
    </div>

    <label for="health-notes">Any relevant medical conditions?</label>
    <textarea id="health-notes" name="health-notes" rows="3"></textarea>

    <!-- Consent -->
    <label>
        <input type="checkbox" name="consent" required> I consent to the blood donation process and declare that the information provided is true.
    </label>

    <button type="submit">Submit Donation Request</button>
</form>

</body>
</html>
