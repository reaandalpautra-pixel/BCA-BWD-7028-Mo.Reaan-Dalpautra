<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Slider with Z-Index</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #f4f4f4;
        }

        .slider-container {
            position: relative;
            width: 600px;
            height: 350px;
            overflow: hidden;
            border-radius: 10px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
        }

        .slide {
            position: absolute;
            width: 100%;
            height: 100%;
            opacity: 0;
            transition: opacity 0.5s ease-in-out;
            z-index: 1; 
        }

        .slide.active {
            opacity: 1;
            z-index: 2; 
        }

        .slide img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .slide-text {
            position: absolute;
            bottom: 20px;
            left: 20px;
            right: 20px;
            background: rgba(0, 0, 0, 0.6);
            color: #fff;
            padding: 15px;
            border-radius: 5px;
            z-index: 3; 
        }

        .nav-btn {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            background: rgba(255, 255, 255, 0.7);
            color: #333;
            border: none;
            padding: 10px 15px;
            cursor: pointer;
            font-size: 18px;
            border-radius: 50%;
            z-index: 10; 
        }

        .prev { left: 10px; }
        .next { right: 10px; }
        .nav-btn:hover { background: white; }
    </style>
</head>
<body>

    <div class="slider-container">
     
        <button class="nav-btn prev" onclick="changeSlide(-1)">&#10094;</button>
        <button class="nav-btn next" onclick="changeSlide(1)">&#10095;</button>

        <div class="slide active">
            <img src="https://picsum.photos/id/1018/600/350" alt="Mountain Landscape">
            <div class="slide-text">
                <h3>Serene Mountains</h3>
                <p>mountain.</p>
            </div>
        </div>

        <div class="slide">
            <img src="https://picsum.photos/id/1015/600/350" alt="River Valley">
            <div class="slide-text">
                <h3>River Valleys</h3>
                <p>river.</p>
            </div>
        </div>

  
        <div class="slide">
            <img src="https://picsum.photos/id/1019/600/350" alt="Ocean Sunset">
            <div class="slide-text">
                <h3>Ocean Waves</h3>
                <p>water waves.</p>
            </div>
        </div>
    </div>

    <script>
        let currentSlide = 0;
        const slides = document.querySelectorAll('.slide');

        function showSlide(index) {
            slides.forEach(slide => slide.classList.remove('active'));
            currentSlide = (index + slides.length) % slides.length;
            slides[currentSlide].classList.add('active');
        }

        function changeSlide(direction) {
            showSlide(currentSlide + direction);
        }
    </script>

</body>
</html>
